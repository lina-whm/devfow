linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - gocyclo
    - goimports
    - misspell
    - revive
    - gosec
linters-settings:
  gocyclo:
    min-complexity: 15
  gofmt:
    simplify: true
run:
  timeout: 5m
  skip-dirs:
    - vendor
